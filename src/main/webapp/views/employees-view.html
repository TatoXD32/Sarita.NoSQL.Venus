
<section id="employees-view" class="view active">

    <div class="toolbar">
        <div>
            <h2>Empleados</h2>
            <span id="count">Consulta de personal registrado</span>
        </div>

        <div class="toolbar-actions">
            <button id="new-employee" class="primary" type="button">
                Nuevo empleado
            </button>
        </div>
    </div>

    <!-- Busqueda unificada de empleados -->
    <div class="search-box employee-search-panel">
        <h3>Buscar empleados</h3>
        <div class="employee-unified-search">
            <label for="employee-search">Número, nombre, apellidos o correo institucional</label>
            <div class="employee-search-input-row">
                <input id="employee-search" type="search"
                    placeholder="Buscar empleado..." autocomplete="off"
                    aria-label="Buscar empleado por número, nombre, apellidos o correo">
                <button id="search-employees" class="primary" type="button">Buscar</button>
            </div>
        </div>
        <div class="employee-search-actions">
            <span class="employee-filter-label">Mostrar:</span>
            <div class="employee-status-buttons" role="group" aria-label="Filtrar por estatus">
                <button type="button" class="employee-status-filter is-active" data-employee-status="" aria-pressed="true">Todos</button>
                <button type="button" class="employee-status-filter" data-employee-status="ACTIVO" aria-pressed="false">Activos</button>
                <button type="button" class="employee-status-filter" data-employee-status="BAJA" aria-pressed="false">Bajas</button>
            </div>
            <button id="clear-filters" type="button">Limpiar</button>
        </div>
    </div>

    <!-- Tabla de empleados -->
    <div class="table-wrap">

        <table class="employees-table">

            <thead>
                <tr>
                    <th>No. empleado</th>
                    <th>Nombre</th>
                    <th>Correo institucional</th>
                    <th>Estatus</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="employees">
                <tr>
                    <td class="empty" colspan="5">
                        Cargando empleados...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

    <!-- Paginacion -->
    <div class="employee-pagination">

        <span id="pagination-info">
            Cargando...
        </span>

        <div class="pagination-actions">

            <button
                id="prev-page"
                type="button"
                disabled
            >
                Anterior
            </button>

            <span id="current-page">
                Página 1 de 1
            </span>

            <button
                id="next-page"
                type="button"
                disabled
            >
                Siguiente
            </button>

        </div>

    </div>

</section>
