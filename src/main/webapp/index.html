<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venus | Recursos humanos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <p class="eyebrow">Venus / Recursos humanos</p>
    <h1>Directorio de empleados</h1>
    <p>Consulta la plantilla, actualiza sus datos y administra los catalogos de la organizacion.</p>
</header>
<nav class="tabs" aria-label="Secciones principales">
    <button class="active" data-view="employees-view" type="button">Empleados</button>
    <button data-view="courses-view" type="button">Cursos y asignaciones</button>
    <button data-view="catalogs-view" type="button">Catalogos</button>
</nav>
<main>
    <div id="app-shell"></div>
</main>
<dialog id="edit-dialog"><div id="employee-form-slot"></div></dialog>
<dialog id="detail-dialog">
    <article class="detail-modal">
        <div class="detail-heading"><div><p class="eyebrow">Ficha de personal</p><h2 id="detail-name">Empleado</h2></div><button type="button" id="close-detail">Cerrar</button></div>
        <div id="employee-detail" class="detail-content"></div>
    </article>
</dialog>
<script src="js/app.js"></script>
</body>
</html>
